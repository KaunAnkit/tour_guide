<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dr Ambedkar National Memorial — Voice Tour Guide</title>
  <meta name="description" content="Interactive voice-guided tour of the Dr Ambedkar National Memorial. Ask questions about Ambedkar's life, speeches, and legacy." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;500;600;700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div id="app">
    <!-- Header -->
    <header id="header">
      <div class="header-inner">
        <div class="logo-mark" aria-hidden="true">
          <img src="/static/assets/brlogo.png" alt="Dr Ambedkar National Memorial Logo" />
        </div>
        <div class="header-text">
          <h1>Dr Ambedkar National Memorial</h1>
          <p class="subtitle">Voice Tour Guide</p>
        </div>
      </div>
    </header>

    <!-- Main dynamic layout container -->
    <main id="main" class="layout-container">
      <!-- Left Column: Voice Hub & Prompt Chips -->
      <section id="voice-column" aria-label="Voice Interaction">
        <!-- Persistent Glowing Orb Station -->
        <div id="orb-scaler">
          <div id="orb-area">
            <div id="orb-glow"></div>
            <div id="orb-ring-outer"></div>
            <div id="orb-ring-inner"></div>
            <div id="orb" role="button" aria-label="Tap to speak" tabindex="0">
              <div id="orb-core"></div>
            </div>
            <p id="orb-label">Tap to speak</p>
          </div>
        </div>

        <!-- Quick-topic exhibit pills -->
        <section id="suggestions" aria-label="Suggested questions">
          <p class="suggestions-label">Explore museum exhibits / प्रदर्शनी देखें:</p>
          <div class="chips-container">
            <button class="chip" data-query="Tell me about the Mahad Satyagraha of 1927 and its historic significance">
              <span class="chip-icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/></svg></span> Mahad Satyagraha
            </button>
            <button class="chip" data-query="डॉक्टर अंबेडकर ने भारतीय संविधान का निर्माण कैसे किया?">
              <span class="chip-icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg></span> संविधान निर्माण
            </button>
            <button class="chip" data-query="1927 के ऐतिहासिक महाड सत्याग्रह के बारे में विस्तार से बताइए">
              <span class="chip-icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/></svg></span> महाड सत्याग्रह
            </button>
            <button class="chip" data-query="How did Dr. Ambedkar lead the drafting of the Indian Constitution?">
              <span class="chip-icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg></span> Drafting Constitution
            </button>
            <button class="chip" data-query="Ambedkar's education at Columbia University and London School of Economics">
              <span class="chip-icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c0 1.1 2.7 3 6 3s6-1.9 6-3v-5"/></svg></span> Columbia & London
            </button>
            <button class="chip" data-query="Tell me about the historic mass conversion to Buddhism at Deekshabhoomi Nagpur in 1956">
              <span class="chip-icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/></svg></span> Deekshabhoomi 1956
            </button>
          </div>
        </section>
      </section>

      <!-- Right Column: Interactive Guide Response Hub & Dynamic Exhibits -->
      <aside id="response-column" aria-label="Memorial Guide Response Hub">
        <!-- Conversation transcript area -->
        <div id="transcript-area">
          <div id="transcript-user" class="transcript-bubble hidden">
            <span class="transcript-tag">You</span>
            <p class="transcript-text"></p>
          </div>
          <div id="transcript-guide" class="transcript-bubble hidden">
            <span class="transcript-tag">Memorial Guide</span>
            <p class="transcript-text"></p>
          </div>
        </div>

        <!-- Museum Artifacts & Records Section -->
        <div id="artifacts-area" class="hidden">
          <div class="artifacts-panel-header">
            <div class="panel-header-title">
              <span class="panel-icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="22" x2="21" y2="22"/><line x1="6" y1="18" x2="6" y2="7"/><line x1="10" y1="18" x2="10" y2="7"/><line x1="14" y1="18" x2="14" y2="7"/><line x1="18" y1="18" x2="18" y2="7"/><polyline points="2 7 12 2 22 7"/></svg></span>
              <h2>Exhibition Archives</h2>
            </div>
            <span id="artifacts-badge" class="artifacts-badge">Artifacts</span>
          </div>
          <div id="artifacts-grid"></div>
        </div>
      </aside>
    </main>

    <!-- Audio element for playback -->
    <audio id="audio-player" preload="none"></audio>

  </div>

  <div id="image-viewer" class="image-viewer hidden" role="dialog" aria-modal="true" aria-label="Full-size exhibit image" aria-hidden="true">
    <button type="button" id="close-image-viewer" class="image-viewer-close" aria-label="Close image viewer">×</button>
    <img id="image-viewer-image" class="image-viewer-image" alt="" />
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
